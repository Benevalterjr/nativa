sonar.projectKey=Benevalterjr_nativa
sonar.organization=benevalterjr

# Escopo estrito de código de produção analisado
sonar.sources=nativa.py,nativa_rt.h,tools/nativa_engine.c,tools/api_server.py
sonar.tests=tests

# Exclusões de análise estática de código experimental, dados, scripts temporários e modelos
sonar.exclusions=models/**,data/**,scripts/**,qutrit_test/**,tools/experimento_*.py,tools/validar_*.py,tools/compare_*.py,tools/*_benchmark*.py,tools/debug_*.c,tools/bench_*.c,tools/teste_*.c,tools/test_*.py,tools/baixar_*.py,tools/train_*.py,tools/gerar_*.py,tools/check_*.py

# Exclusões de duplicação de código (CPD) para testes e subprojetos experimentais
sonar.cpd.exclusions=tests/**,tools/**,qutrit_test/**
