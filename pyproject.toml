[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nativa"
version = "0.4.0"
description = "A programming language and runtime for efficient AI inference, BitNet b1.58, and dense tensors"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Benevalterjr" }
]
keywords = [
    "compiler",
    "runtime",
    "ai",
    "inference",
    "bitnet",
    "ternary",
    "safetensors",
    "c99",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
]
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
tools = [
    "torch>=2.0.0",
    "transformers>=4.36.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.20.0",
]

[project.scripts]
nativa = "nativa:main"

[project.urls]
Homepage = "https://github.com/Benevalterjr/nativa"
Repository = "https://github.com/Benevalterjr/nativa"
Issues = "https://github.com/Benevalterjr/nativa/issues"

[tool.setuptools]
py-modules = ["nativa"]
